<!DOCTYPE html>

<!-- The CSS examples are all designed to work with this page. Try swapping them out on line 29 and see what happens. -->


<!-- This is a comment -->


<html> 
    <!-- HTML is heirarchial: tags like this define elements on the page. 
    Each tag does something different. For example:
        - The <html> tag defines the whole document.
        - The <h1> tag defines a large heading
        - The <p> tag defines a paragraph
        - Tags appear as an opening <div> and closing </div> pair
    -->


<head>    
    <!-- The head tag links to resources our page needs and defines information about it. Tags in the <head> aren't displayed on the page. -->


    <!-- This is a link to a stylesheet which contains rules about how each element on the page should be defined-->
    <!-- Try swapping to example3.css or another, and take a look at each example.css to see if you understand it-->
    <link rel="stylesheet" type="text/css" href="index3.css">
    <title>My Portfolio</title> <!-- The title displayed in the browser tab, not on the page itself -->


    <!-- This is a link to the vega-lite packages which we're using to make graphs -->
    <script src="https://cdn.jsdelivr.net/npm/vega@6.4.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.3"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.3.0"></script>


    <style>
        /* CSS styles can be defined here, or in a separate CSS file */
        #chartGrid {
            display: flex;
        }
        
    </style>
</head>


<body> 

    <h1 class="big" style="margin-bottom: 0px;"> <!-- We have added a class to the header called "big" which we can use to style it in the CSS -->
       
        Shelby Sorrells
    </h1>
    <p style="margin-top: 0px; color: darkblue">
       
            <a href="https://www.linkedin.com/in/shelby-sorrells/">LinkedIn</a> | <a
            href="https://www.github.com/shelbysorrells">GitHub</a>
    </p>


   
    <section>
        <div class="chart-description">
            <h2>CC1:</h2>
        </div>

        <div id="chartGrid">
            
            <figure id="Location1"></figure>
            <figure id="Location2"></figure>
        </div>
    </section>

    <section>
        <div class="chart-description">
            <h2>CC2:</h2>
        </div>

        <div id="chartGrid">
           
            <figure id="Location3"></figure>
            <figure id="Location4"></figure>
        </div>
    </section>


    <script>
      

        let chart1 = "https://raw.githubusercontent.com/RDeconomist/RDeconomist.github.io/refs/heads/main/charts/library/chartLine5.json";


        vegaEmbed('#Location1', chart1) 
        
        let chart2 = "https://raw.githubusercontent.com/RDeconomist/RDeconomist.github.io/refs/heads/main/charts/library/chartLine2.json"; 
        vegaEmbed('#Location2', chart2)

         let chart3 = "https://raw.githubusercontent.com/shelbysorrells/shelbysorrells.github.io/refs/heads/main/visualization.vl.json";

        vegaEmbed('#Location3', chart3)


         let chart4 = "https://raw.githubusercontent.com/shelbysorrells/shelbysorrells.github.io/refs/heads/main/Crime%20chart.json"; 


        vegaEmbed('#Location4', chart4) 

    </script>
</html>
